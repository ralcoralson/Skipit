name: SkipIt CI / Hardening Pipeline

on:
  push:
    branches:
      - main
      - hardening-and-rental-flow
  pull_request:
    branches:
      - main

jobs:
  backend-lint-and-test:
    name: Backend Lint & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install Backend Production & Dev Dependencies
        run: npm --prefix apps/backend ci

      - name: Backend Lint Check (ESLint)
        run: npm --prefix apps/backend run lint

      - name: Run Backend Security & Unit Test Suite
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_chars_long
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_ANON_KEY: mock_anon_key
          SUPABASE_SERVICE_ROLE_KEY: mock_service_key
        run: npm --prefix apps/backend test

  web-lint-and-build:
    name: Web App Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm --prefix apps/web ci

      - name: Web Lint Check (Next.js ESLint)
        run: npm --prefix apps/web run lint

      - name: Web Production Build Check
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: https://api.skipit.example.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://api.skipit.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock_anon_key
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: mock-web-google-client-id.apps.googleusercontent.com
        run: npm --prefix apps/web run build

  mobile-analyze-and-test:
    name: Mobile Flutter Analyze & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: cd apps/mobile && flutter pub get

      - name: Analyze Flutter Code
        run: cd apps/mobile && flutter analyze

      - name: Run Flutter Widget Tests
        run: cd apps/mobile && flutter test

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend High/Critical Dependency Audit
        run: npm --prefix apps/backend audit --omit=dev --audit-level=high
